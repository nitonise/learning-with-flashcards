<div class="app-shell">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <mat-toolbar class="topbar">
    <a class="brand" routerLink="/decks" aria-label="Flashcards home">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span>
        <span class="brand-title">Flashcards</span>
        <span class="brand-subtitle">Local study workspace</span>
      </span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a
        mat-button
        routerLink="/decks"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Library
      </a>
      <a mat-button routerLink="/decks/new" routerLinkActive="is-active">New deck</a>
    </nav>

    <div class="library-count" aria-label="Library totals">
      <span>{{ deckCount() }} decks</span>
      <span>{{ cardCount() }} cards</span>
    </div>

    <button
      mat-icon-button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-pressed]="themeService.isDark()"
      (click)="themeService.toggleTheme()"
    >
      <mat-icon aria-hidden="true">{{
        themeService.isDark() ? 'dark_mode' : 'light_mode'
      }}</mat-icon>
    </button>
  </mat-toolbar>

  <main #mainContent id="main-content" class="app-main" tabindex="-1">
    <router-outlet />
  </main>
</div>
