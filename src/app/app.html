<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/decks" aria-label="Flashcards home">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span>
        <span class="brand-title">Flashcards</span>
        <span class="brand-subtitle">Local study workspace</span>
      </span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation">
      <a
        routerLink="/decks"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Library
      </a>
      <a routerLink="/decks/new" routerLinkActive="is-active">New deck</a>
    </nav>

    <div class="library-count" aria-label="Library totals">
      <span>{{ deckCount() }} decks</span>
      <span>{{ cardCount() }} cards</span>
    </div>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Dark theme"
      [attr.aria-pressed]="themeService.isDark()"
      (click)="themeService.toggleTheme()"
    >
      <span class="theme-toggle__icon" aria-hidden="true">
        @if (themeService.isDark()) {
          <span class="theme-toggle__moon"></span>
        } @else {
          <span class="theme-toggle__sun"></span>
        }
      </span>
      <span>{{ themeService.isDark() ? 'Dark' : 'Light' }}</span>
    </button>
  </header>

  <main class="app-main" tabindex="-1">
    <router-outlet />
  </main>

  <app-toast />
</div>
