<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">{{ cancelLabel }}</button>
  <button
    mat-flat-button
    type="button"
    [class.confirm-action--danger]="isDanger"
    [mat-dialog-close]="true"
  >
    {{ confirmLabel }}
  </button>
</mat-dialog-actions>
